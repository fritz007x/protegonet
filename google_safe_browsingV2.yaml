openapi: 3.0.0
info:
  title: Google Safe Browsing API
  version: 1.0.0

servers:
  - url: https://safebrowsing.googleapis.com

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: key

security:
  - ApiKeyAuth: [AIzaSyDrHalueqpqOJSc_ubn5WhfWSMoyKJB30c]

paths:
  /v4/threatMatches:find:
    post:
      operationId: checkThreat
      security:
        - ApiKeyAuth: [AIzaSyDrHalueqpqOJSc_ubn5WhfWSMoyKJB30c]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client:
                  type: object
                  properties:
                    clientId:
                      type: string
                    clientVersion:
                      type: string
                threatInfo:
                  type: object
                  properties:
                    threatTypes:
                      type: array
                      items:
                        type: string
                    platformTypes:
                      type: array
                      items:
                        type: string
                    threatEntryTypes:
                      type: array
                      items:
                        type: string
                    threatEntries:
                      type: array
                      items:
                        type: object
                        properties:
                          url:
                            type: string

      responses:
        '200':
          description: OK
